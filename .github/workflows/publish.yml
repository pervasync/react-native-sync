name: Publish package to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Run tests
        run: npm test

      - name: Publish package
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_SPEC="$PACKAGE_NAME@$PACKAGE_VERSION"

          if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice title=npm publish verified::$PACKAGE_SPEC is already available from npm."
            exit 0
          fi

          set +e
          npm publish --access public 2>&1 | tee /tmp/npm-publish.log
          PUBLISH_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            PUBLISH_ERROR="$(grep -E 'npm (error|ERR!)' /tmp/npm-publish.log | tail -20 | tr '\n' ' ')"
            if [ -z "$PUBLISH_ERROR" ]; then
              PUBLISH_ERROR="$(tail -20 /tmp/npm-publish.log | tr '\n' ' ')"
            fi
            PUBLISH_ERROR="${PUBLISH_ERROR//'%'/'%25'}"
            echo "::error title=npm publish failed::$PUBLISH_ERROR"
            exit "$PUBLISH_STATUS"
          fi

          for VERIFY_ATTEMPT in 1 2 3 4 5; do
            if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "::notice title=npm publish verified::$PACKAGE_SPEC is available from npm."
              exit 0
            fi
            sleep 5
          done

          echo "::error title=npm publish verification failed::$PACKAGE_SPEC was not visible from npm after publishing."
          exit 1
